name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format --verify-no-changes
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
  aot-linux:
    # A cheap NativeAOT check on every PR: trimming/AOT breakage (a reflection-only API, a lost embedded resource) fails here, not at
    # release time. It links against the runner's own glibc; the release builds link against glibc 2.27 (see release.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: The runtime pin is not behind this SDK
        run: |
          dotnet --list-runtimes > "$RUNNER_TEMP/runtimes.txt"
          sh scripts/check-runtime-pin.sh installed "$RUNNER_TEMP/runtimes.txt" src/LanQueue/LanQueue.csproj
      - run: dotnet publish src/LanQueue -c Release -r linux-x64 -p:LanqNative=true -p:Version=0.0.0-ci -o native
      - run: ls -l native && sh scripts/smoke-native.sh native/lanq 0.0.0-ci
