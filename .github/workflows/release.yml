name: release
on:
  push:
    tags: ['v*.*.*']
  # A manual run (no inputs) builds, tests and smoke-tests everything and never attests or publishes: those jobs need a tag push.
  workflow_dispatch:
permissions:
  contents: read
# Order: pack (tests + NuGet tool) -> native (one NativeAOT binary per target, smoke-tested where the runner can run it) -> smoke (the
# arm64 binaries on real arm64; the Linux ones inside Ubuntu 18.04, glibc 2.27) -> assemble (SHA256SUMS + Scoop lanq.json) -> attest ->
# publish. Nothing is published unless every binary built and passed its smoke test. publish puts every asset on a DRAFT release first,
# then pushes to nuget.org, then makes the release public, so a failure at any point leaves nothing half-published. After a failure,
# re-run the failed jobs only, never "re-run all jobs" (RELEASING.md). Values from refs and step outputs reach run: blocks only via env:.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: The runtime pin is not behind this SDK
        run: |
          dotnet --list-runtimes > "$RUNNER_TEMP/runtimes.txt"
          sh scripts/check-runtime-pin.sh installed "$RUNNER_TEMP/runtimes.txt" src/LanQueue/LanQueue.csproj
      - id: ver
        name: Version (strict semver from the tag; prerelease when it has a '-')
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sh scripts/release-version.sh "$REF_NAME" "$IS_TAG" "$RUN_NUMBER" > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -warnaserror -p:Version="$VERSION"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/LanQueue -c Release --no-build -p:Version="$VERSION" -o nupkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
  native:
    needs: pack
    name: native ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux: built inside Microsoft's .NET 10 cross-build image and linked against its Ubuntu 18.04 sysroot (glibc 2.27, the .NET 10
          # floor), never against the runner's own newer glibc. Images pinned by digest.
          - rid: linux-x64
            runner: ubuntu-24.04
            container: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64@sha256:3d9b12839eb1352678e577c3fada879ea1e92fe5923da4d260786e7b6d7b0075
            publish-args: -p:SysRoot=/crossrootfs/x64 -p:LinkerFlavor=lld
            smoke: true
          - rid: linux-arm64
            runner: ubuntu-24.04
            container: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64@sha256:15c15aac729f136bc69c32bdb2582324a226f19bcabf24cb4d283b1bacbc2ff9
            publish-args: -p:SysRoot=/crossrootfs/arm64 -p:LinkerFlavor=lld
            smoke: false # cross-compiled on x64; smoke-tested on arm64 in the smoke job
          - rid: win-x64
            runner: windows-2025
            smoke: true
          - rid: win-arm64
            runner: windows-2025
            smoke: false # cross-compiled on x64; smoke-tested on arm64 in the smoke job
          - rid: osx-arm64
            runner: macos-15
            smoke: true
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      VERSION: ${{ needs.pack.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (NativeAOT)
        env:
          PUBLISH_ARGS: ${{ matrix.publish-args }}
        # PUBLISH_ARGS is unquoted on purpose: it holds the matrix's -p: switches (or nothing).
        run: dotnet publish src/LanQueue -c Release -r "$RID" -p:LanqNative=true -p:Version="$VERSION" -p:SourceRevisionId="$GITHUB_SHA" -o native $PUBLISH_ARGS
      - name: Stage
        run: |
          mkdir -p stage dist
          if [ -f native/lanq.exe ]; then cp native/lanq.exe stage/; else cp native/lanq stage/; fi
          cp LICENSE THIRD-PARTY-NOTICES.txt stage/
          ls -l stage
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C stage -czf "dist/lanq-$RID.tar.gz" lanq LICENSE THIRD-PARTY-NOTICES.txt
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "dist/lanq-$env:RID.zip" -CompressionLevel Optimal
      - name: Unpack for the smoke test
        if: matrix.smoke && runner.os != 'Windows'
        run: mkdir unpacked && tar -C unpacked -xzf "dist/lanq-$RID.tar.gz"
      - name: Unpack for the smoke test
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist/lanq-$env:RID.zip" -DestinationPath unpacked
      - name: Smoke test the packaged binary
        if: matrix.smoke
        run: |
          ls -l dist
          if [ -f unpacked/lanq.exe ]; then bin=unpacked/lanq.exe; else bin=unpacked/lanq; fi
          sh scripts/smoke-native.sh "$bin" "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
  smoke:
    needs: [pack, native]
    name: smoke ${{ matrix.rid }} (${{ matrix.where }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            where: Ubuntu 18.04, glibc 2.27
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            where: Ubuntu 18.04, glibc 2.27
          - rid: win-arm64
            runner: windows-11-arm
            where: Windows arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.pack.outputs.version }}
      RID: ${{ matrix.rid }}
      # The oldest distro the Linux binaries promise to run on, pinned by digest (multi-arch index: amd64 and arm64).
      OLD_DISTRO: ubuntu:18.04@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-${{ matrix.rid }}
          path: dist
      - name: Smoke test (Linux, inside the old distro)
        if: runner.os == 'Linux'
        run: |
          mkdir unpacked && tar -C unpacked -xzf "dist/lanq-$RID.tar.gz"
          docker run --rm -v "$PWD:/src:ro" "$OLD_DISTRO" sh -c 'ldd --version | head -n 1 && sh /src/scripts/smoke-native.sh /src/unpacked/lanq "$0"' "$VERSION"
      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist/lanq-$env:RID.zip" -DestinationPath unpacked
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: sh scripts/smoke-native.sh unpacked/lanq.exe "$VERSION"
  assemble:
    needs: [pack, native, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nupkg
          path: release
      - name: SHA256SUMS and the Scoop manifest
        working-directory: release
        run: |
          want=$(printf '%s\n' LanQueue.$VERSION.nupkg lanq-linux-arm64.tar.gz lanq-linux-x64.tar.gz lanq-osx-arm64.tar.gz lanq-win-arm64.zip lanq-win-x64.zip | sort)
          if [ "$(ls -1 | sort)" != "$want" ]; then
            echo "::error::unexpected release assets: $(ls -1 | tr '\n' ' ')"
            exit 1
          fi
          sha256sum -- * > ../binaries.sha256
          sh ../scripts/scoop-manifest.sh "$VERSION" ../binaries.sha256 > lanq.json
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
  attest:
    needs: [pack, assemble]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can mint an OIDC token and write attestations; it runs no project code.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.nupkg
            release/*.zip
            release/*.tar.gz
            release/lanq.json
            release/SHA256SUMS
  publish:
    needs: [pack, assemble, attest]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget-release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Require NUGET_USER variable
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository variable NUGET_USER is not set (your nuget.org profile name, not email). See RELEASING.md."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - name: Draft the GitHub release with every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease }}
        # A re-run reuses its own draft only when that draft is empty or has this build's SHA256SUMS; a published release is never touched.
        run: sh scripts/release-draft.sh draft "v$VERSION" "$PRERELEASE" release
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "release/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Make the GitHub release public (a prerelease is never marked latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease }}
        run: sh scripts/release-draft.sh publish "v$VERSION" "$PRERELEASE"
