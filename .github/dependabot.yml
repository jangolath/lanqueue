version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories: ["/", "/samples/monorepo"]
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
  # The sample monorepo's web part (samples/monorepo/web): one grouped pull request a week.
  - package-ecosystem: npm
    directory: /samples/monorepo/web
    schedule:
      interval: weekly
    groups:
      sample-web:
        patterns: ["*"]
