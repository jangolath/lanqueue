# lanq's own test plan: lanq run --plan --json --no-wake (see docs/PLANS.md, and docs/SHARDING.md for the scripts).
# It runs on Windows workers (tag them windows in capabilities). Your machines.yml must allow exactly these commands
# (policy.allowed_commands), never a bare powershell:
#   "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lanq/dotnet-test-shard.ps1"
#   "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lanq/check-test-split.ps1"
# The shard count is fixed (not auto), so baselines and history compare like with like; guard's -Shards matches
# unit-windows. Never edit this file or the scripts to turn a red run green.
version: 1
defaults:
  needs: [dotnet, windows]
  timeout: 30
  baseline: true
jobs:
  guard:
    command: [powershell, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/lanq/check-test-split.ps1, -Project, tests/LanQueue.Tests/LanQueue.Tests.csproj, -Shards, "2"]
  unit-windows:
    command: [powershell, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/lanq/dotnet-test-shard.ps1, -Project, tests/LanQueue.Tests/LanQueue.Tests.csproj]
    shards: 2
    fetch: ["tests/LanQueue.Tests/TestResults/*.trx"]
  # With Linux workers (tagged linux), uncomment this job too, and allow "sh scripts/lanq/dotnet-test-shard.sh" and
  # "sh scripts/lanq/check-test-split.sh". It is left out by default because lanq.yml has no conditions: on a pool
  # with no Linux machine it could never run, and the plan would fail. CI runs both guards on Linux and Windows.
  # unit-linux:
  #   command: [sh, scripts/lanq/dotnet-test-shard.sh, tests/LanQueue.Tests/LanQueue.Tests.csproj]
  #   needs: [dotnet, linux]
  #   shards: 4
  #   fetch: ["tests/LanQueue.Tests/TestResults/*.trx"]
  # guard-linux:
  #   command: [sh, scripts/lanq/check-test-split.sh, tests/LanQueue.Tests/LanQueue.Tests.csproj, "4"]
  #   needs: [dotnet, linux]
