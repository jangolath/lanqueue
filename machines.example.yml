# Example registry. Copy to a private location (for example ~/.config/lanq/machines.yml) and edit.
# Pass it with --config or LANQ_CONFIG; lanq never reads a config from the current directory implicitly.
# Never commit real hosts or key paths.
#
# Hosts must already be in known_hosts (StrictHostKeyChecking=yes), and key-based login must work.
#
# Two ways to authenticate (both are key-only; there is no password option):
#   1. ssh-agent (preferred): omit key_env. lanq passes no -i and ssh uses the identities in your agent.
#        ssh-add -l && ssh user@build-01.lan true
#   2. A key file: set key_env to the NAME of an environment variable that holds the key file's path.
#        ssh -i "$LANQ_KEY_BUILD02" user@build-02.lan true
#      `lanq health` warns if that file has no passphrase. See the README, "Keeping your keys safe".

policy:
  # A machine whose load ratio (0..1, load average per core on Linux, CPU% on Windows) is above this is "hold short".
  load_threshold: 0.80
  # A job's argv must start with one of these token sequences. Everything else is refused.
  allowed_commands:
    - dotnet build
    - dotnet test
    - npm ci
    - npm test
    - git status
  # Directories (relative to the repo root) a job may run in. "src" also allows "src/App".
  allowed_directories:
    - "."
    - src
    - tests

machines:
  - name: build-01
    os: linux                  # linux | windows
    ssh: user@build-01.lan     # user@host, key-only
    # No key_env: authenticates with the key loaded in ssh-agent (preferred).
    work_root: /srv/lanq       # absolute, forward slashes, no spaces
    capabilities: [dotnet, node, linux]
    max_jobs: 2
    transfer: git              # git (default, recommended): bundle + per-job worktree; the worker needs git

  - name: build-02
    os: windows
    ssh: user@build-02.lan
    key_env: LANQ_KEY_BUILD02  # optional: NAME of an env var holding the path to a key file (pins that key only)
    work_root: D:/lanq
    capabilities: [dotnet, windows]
    max_jobs: 1
    allowed_hours: "22:00-07:00"   # optional; local time of the machine running lanq; may wrap midnight

  # An old PC without git: it needs only SSH, tar (built into Linux and Windows 10 1803+) and your toolchain.
  - name: old-pc
    os: linux
    ssh: user@old-pc.lan
    work_root: /srv/lanq
    capabilities: [dotnet, linux]
    max_jobs: 1
    transfer: archive          # a tar.gz of the same snapshot, extracted into a fresh per-job folder (no git on the worker)
